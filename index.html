<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Notesinger</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root{--accent:#f00;--line:rgba(255,0,0,.35);--muted:rgba(255,255,255,.8)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--muted);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
  #shell{display:flex;flex-direction:column;height:100%}
  #top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:linear-gradient(90deg,#000,#300000);border-bottom:2px solid var(--line)}
  #top img{width:28px;height:28px;border-radius:6px;border:1px solid var(--line)}
  #top b{color:var(--accent);margin-right:8px}
  .tab,.act{background:none;border:2px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:8px;font-weight:700;cursor:pointer;font:inherit}
  .tab.on{background:var(--accent);color:#100;border-color:var(--accent)}
  .tab:hover:not(.on),.act:hover{color:var(--accent)}
  .sp{flex:1}
  #who{font-size:12px;opacity:.7;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stage{flex:1;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:none}
  iframe.on{display:block}
  #snapModal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:99}
  #snapModal.open{display:flex}
  #snapBox{background:#0f0f0f;border:2px solid var(--line);border-radius:12px;padding:18px;width:460px;max-width:94%;max-height:85vh;overflow:auto}
  #snapBox h3{margin:0 0 10px;color:var(--accent)}
  .srow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
  .srow span{flex:1}
  #msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#200;border:2px solid var(--line);padding:8px 14px;border-radius:8px;display:none;z-index:100}
</style>
</head>
<body>
<div id="shell">
  <div id="top">
    <img src="/icon.png" alt="">
    <b>Aura Notesinger</b>
    <button class="tab on" data-app="music">Music</button>
    <button class="tab" data-app="codex">Codex</button>
    <span class="sp"></span>
    <span id="who"></span>
    <button class="act" id="save" hidden>Save to cloud</button>
    <button class="act" id="restore" hidden>Cloud snapshots</button>
    <button class="act" id="sign">Sign in</button>
  </div>
  <div id="stage">
    <iframe id="f-music" class="on" data-src="/apps/music.html" title="Aura Music"></iframe>
    <iframe id="f-codex" data-src="/apps/codex.html" title="Aura Codex"></iframe>
  </div>
</div>
<div id="snapModal"><div id="snapBox"></div></div>
<div id="msg"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
